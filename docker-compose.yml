services:
  postgres:
    image: postgres:17-alpine
    container_name: onekawayan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onekawayan
      POSTGRES_PASSWORD: onekawayan
      POSTGRES_DB: onekawayan
    ports:
      - '5432:5432'
    volumes:
      - onekawayan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onekawayan -d onekawayan']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onekawayan-pgdata:
